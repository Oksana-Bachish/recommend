[project]
name = "recommendation-service"
version = "0.1.0"
description = "FastAPI asynchronous microservice for dynamic product recommendations using asyncpg"
requires-python = ">=3.10"
dependencies = [
    'annotated-doc==0.0.4',
    'annotated-types==0.7.0',
    'anyio==4.14.1',
    'async-timeout==5.0.1',
    'asyncpg==0.31.0',
    'click==8.4.2',
    'colorama==0.4.6',
    'exceptiongroup==1.3.1',
    'fastapi==0.139.0',
    'h11==0.16.0',
    'idna==3.18',
    'pydantic==2.13.4',
    'pydantic_core==2.46.4',
    'python-dotenv==1.2.2',
    'starlette==1.3.1',
    'typing-inspection==0.4.2',
    'typing_extensions==4.16.0',
    'uvicorn==0.50.0',
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "pytest-mock",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
